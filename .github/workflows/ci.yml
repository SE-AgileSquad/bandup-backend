name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        # Run each test host directly instead of through "dotnet test": its --server IPC
        # handshake fails against this SDK regardless of timing, concurrency or TMPDIR.
        run: |
          mkdir -p TestResults
          dotnet exec tests/BandUp.UnitTests/bin/Release/net10.0/BandUp.UnitTests.dll --report-trx --results-directory TestResults
          dotnet exec tests/BandUp.ArchitectureTests/bin/Release/net10.0/BandUp.ArchitectureTests.dll --report-trx --results-directory TestResults
          dotnet exec tests/BandUp.IntegrationTests/bin/Release/net10.0/BandUp.IntegrationTests.dll --report-trx --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
