name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        # TMPDIR is forced to /tmp because Microsoft.Testing.Platform's handshake uses a Unix
        # domain socket under TMPDIR, whose path has a ~108-char limit; the runner's default
        # work directory (/home/runner/work/<repo>/<repo>/...) is long enough to exceed it,
        # which fails the handshake before a single test runs.
        run: dotnet test --no-build -c Release -- --report-trx --results-directory TestResults
        env:
          TMPDIR: /tmp

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
